<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title th:text="${title}">Mirra</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #2D2926; background-color: #FEFCFB; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #FEFCFB;">
        <tr>
            <td align="center">
                <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width: 600px; background-color: #FFFFFF;">

                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 40px 30px 30px 30px; background: linear-gradient(135deg, #FAF7F5 0%, #F5F0ED 100%);">
                            <a href="#" style="display: inline-block; text-decoration: none;">
                                <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; font-weight: 600; color: #8B5A5A; letter-spacing: 0.05em;">Mirra</span>
                            </a>
                        </td>
                    </tr>

                    <!-- Main Content -->
                    <tr>
                        <td style="padding: 40px 50px;" th:insert="~{::content}">

                        </td>
                    </tr>

                    <!-- Divider -->
                    <tr>
                        <td style="padding: 0 50px;">
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td style="border-top: 1px solid #E8E2DE;"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 30px 50px 40px 50px; background-color: #FAF7F5;">
                            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                                <tr>
                                    <td style="text-align: center;">
                                        <p style="margin: 0 0 8px 0; font-size: 14px; color: #6B6560;">
                                            You're receiving this email because you have an account with Mirra.
                                        </p>
                                        <p style="margin: 0 0 16px 0; font-size: 14px; color: #6B6560;">
                                            <a href="#" style="color: #8B5A5A; text-decoration: none;">Manage Preferences</a>
                                            &nbsp;&bull;&nbsp;
                                            <a href="#" style="color: #8B5A5A; text-decoration: none;">Unsubscribe</a>
                                        </p>
                                        <p style="margin: 0; font-size: 12px; color: #9B9590;">
                                            &copy; <span th:text="${currentYear}">2026</span> Mirra. All rights reserved.
                                        </p>
                                        <p style="margin: 8px 0 0 0; font-size: 12px; color: #9B9590;">
                                            123 Fashion Avenue, Mumbai, Maharashtra 400001
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
