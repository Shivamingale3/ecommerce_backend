spring:
  application:
    name: invoice-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:./.env
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invoice_db}
    username: ${SPRING_DATASOURCE_USERNAME:invoice_user}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.example.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# JWT configuration (defaults; override per profile)
jwt:
  secret: ${JWT_SECRET:change_me_you_must_set_a_256_bit_secret_minimum_in_production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Invoice defaults
invoice:
  sequence-format: "INV-%04d-%06d" # format: INV-{year}-{sequence}
  sequence-cache-size: 100

# Reminder scheduler
reminder:
  cron: "0 0 * * * *" # every hour
  max-attempts: 3
  enabled: ${REMINDER_ENABLED:true}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.shivamingale.invoice: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
