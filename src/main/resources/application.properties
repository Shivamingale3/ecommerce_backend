# Spring Boot Application Configuration
spring.application.name=invoice-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:./.env

# DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invoice_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:invoice_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.example.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Custom Mail Properties
mail-custom.from=${MAIL_FROM:noreply@example.com}
mail-custom.from-name=${MAIL_FROM_NAME:Invoice Platform}
mail-custom.health-check-enabled=true

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# File Upload Size Limits (Multipart)
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
spring.servlet.multipart.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:change_me_you_must_set_a_256_bit_secret_minimum_in_production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Invoice Configuration
invoice.sequence-format=INV-%04d-%06d
invoice.sequence-cache-size=100

# Reminder Scheduler Configuration
reminder.cron=0 0 * * * *
reminder.max-attempts=3
reminder.enabled=${REMINDER_ENABLED:true}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Cookie Configuration
cookie.access-token-name=${COOKIE_ACCESS_TOKEN_NAME:access_token}
cookie.refresh-token-name=${COOKIE_REFRESH_TOKEN_NAME:refresh_token}
cookie.path=/
cookie.access-token-max-age=${COOKIE_ACCESS_TOKEN_MAX_AGE:86400}
cookie.refresh-token-max-age=${COOKIE_REFRESH_TOKEN_MAX_AGE:604800}
cookie.http-only=true
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=Strict

# Logging Configuration
logging.level.root=INFO
logging.level.com.shivamingale.ecom=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Trace/Debug Configuration
app.trace.enabled=${APP_TRACE_ENABLED:false}

# CORS Configuration
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5111}
app.cors-allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors-allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Trace-Id}
app.cors-allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

# Object Storage Configuration (MinIO / S3 Compatible)
object-storage.enabled=${OBJECT_STORAGE_ENABLED:true}
object-storage.endpoint=${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
object-storage.region=${OBJECT_STORAGE_REGION:us-east-1}
object-storage.access-key=${OBJECT_STORAGE_ACCESS_KEY:minioadmin}
object-storage.secret-key=${OBJECT_STORAGE_SECRET_KEY:minioadmin123}
object-storage.bucket=${OBJECT_STORAGE_BUCKET:ecommerce-bucket}
object-storage.public-url-prefix=${OBJECT_STORAGE_PUBLIC_URL_PREFIX:http://localhost:9000/ecommerce-bucket}