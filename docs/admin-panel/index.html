<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Task Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%233b82f6' rx='15' width='100' height='100'/><path fill='white' d='M25 30h50v10H25zM25 45h50v10H25zM25 60h35v10H25z'/></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --bg-detail: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --in-progress: #f97316;
      --danger: #ef4444;
      --code-bg: #0d1117;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .title-group p { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.2rem; }

    .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .btn {
      padding: 0.4rem 0.8rem;
      border-radius: 0.4rem;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-hover); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { opacity: 0.9; }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: 0.5rem;
      padding: 0.75rem;
      border: 1px solid var(--border);
    }

    .stat-card .label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-card .value { font-size: 1.25rem; font-weight: 700; margin-top: 0.2rem; }
    .stat-card .value.success { color: var(--success); }
    .stat-card .value.in-progress { color: var(--in-progress); }
    .stat-card .value.pending { color: var(--text-muted); }

    .progress-section {
      background: var(--bg-card);
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .progress-header h3 { font-size: 0.8rem; font-weight: 600; }
    .progress-header .percent { font-size: 1rem; font-weight: 700; color: var(--accent); }

    .progress-track { height: 0.35rem; background: var(--bg); border-radius: 999px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .status-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .status-pill {
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .status-pill:hover { border-color: var(--accent); }
    .status-pill.active { background: var(--accent); border-color: var(--accent); color: white; }

    .status-pill .count { opacity: 0.7; margin-left: 0.2rem; }

    .search-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      padding: 0.4rem 0.75rem;
      color: var(--text);
      font-size: 0.75rem;
      width: 100%;
      max-width: 250px;
    }

    .search-box:focus { outline: none; border-color: var(--accent); }
    .search-box::placeholder { color: var(--text-muted); }

    .phases-grid { display: flex; flex-direction: column; gap: 0.75rem; }

    .phase-card {
      background: var(--bg-card);
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .phase-card:hover { border-color: var(--accent); }

    .phase-header {
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .phase-header:hover { background: var(--bg-hover); }

    .phase-title { display: flex; align-items: center; gap: 0.6rem; }

    .phase-badge {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 0.4rem;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .phase-info h3 { font-size: 0.9rem; font-weight: 600; }
    .phase-info .meta { font-size: 0.65rem; color: var(--text-muted); }

    .phase-actions { display: flex; align-items: center; gap: 0.75rem; }

    .phase-progress { font-size: 0.75rem; color: var(--text-muted); }
    .phase-progress .done { color: var(--success); font-weight: 600; }

    .phase-toggle {
      width: 1.25rem;
      height: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .phase-card.expanded .phase-toggle { transform: rotate(180deg); }

    .phase-content { display: none; border-top: 1px solid var(--border); }
    .phase-card.expanded .phase-content { display: block; }

    .task-list { padding: 0.5rem; }

    .task-item {
      border-radius: 0.4rem;
      margin-bottom: 0.5rem;
      border: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .task-item:last-child { margin-bottom: 0; }

    .task-item:hover { border-color: var(--border); }

    .task-header {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.6rem;
    }

    .task-checkbox {
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 0.3rem;
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 0.1rem;
      transition: all 0.15s;
    }

    .task-checkbox:hover { border-color: var(--accent); }
    .task-checkbox.checked { background: var(--success); border-color: var(--success); }
    .task-checkbox svg { display: none; width: 0.65rem; height: 0.65rem; color: white; }
    .task-checkbox.checked svg { display: block; }

    .task-main { flex: 1; min-width: 0; }

    .task-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .task-name { font-size: 0.85rem; font-weight: 500; }
    .task-item.completed .task-name { text-decoration: line-through; color: var(--text-muted); }
    .task-item.in-progress .task-name { color: var(--in-progress); }

    .task-endpoint {
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      background: var(--code-bg);
      border-radius: 0.25rem;
      color: var(--accent);
    }

    .task-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }

    .badge {
      font-size: 0.6rem;
      padding: 0.1rem 0.4rem;
      border-radius: 0.25rem;
      font-weight: 500;
    }

    .badge-in-progress { background: rgba(249, 115, 22, 0.2); color: var(--in-progress); }
    .badge-completed { background: rgba(34, 197, 94, 0.2); color: var(--success); }

    .task-actions { display: flex; gap: 0.4rem; }

    .btn-sm {
      padding: 0.2rem 0.5rem;
      font-size: 0.65rem;
      border-radius: 0.25rem;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }

    .btn-sm-inprogress { background: rgba(249, 115, 22, 0.2); color: var(--in-progress); }
    .btn-sm-inprogress:hover { background: rgba(249, 115, 22, 0.3); }
    .btn-sm-inprogress.active { background: var(--in-progress); color: white; }

    .btn-sm-delete { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    .btn-sm-delete:hover { background: rgba(239, 68, 68, 0.3); }

    .task-details {
      display: none;
      padding: 0 0.6rem 0.6rem 0.6rem;
      margin-top: 0.5rem;
      border-top: 1px solid var(--border);
      padding-top: 0.5rem;
    }

    .task-item.show-details .task-details { display: block; }

    .detail-section {
      margin-bottom: 0.75rem;
    }

    .detail-section:last-child { margin-bottom: 0; }

    .detail-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .detail-value { font-size: 0.8rem; }

    code {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      background: var(--code-bg);
      padding: 0.1rem 0.3rem;
      border-radius: 0.2rem;
      font-size: 0.75rem;
    }

    pre {
      background: var(--code-bg);
      border-radius: 0.4rem;
      padding: 0.75rem;
      overflow-x: auto;
      font-size: 0.7rem;
      line-height: 1.5;
      margin-top: 0.3rem;
    }

    pre code { background: none; padding: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      margin-top: 0.3rem;
    }

    th, td {
      text-align: left;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--border);
    }

    th { background: var(--bg); font-weight: 600; }
    td:first-child { color: var(--accent); font-family: monospace; }
    td:last-child { color: var(--text-muted); }

    .error-table td:nth-child(2) { color: var(--danger); font-weight: 500; }
    .error-table td:last-child { color: var(--text-muted); }

    ul { padding-left: 1.25rem; font-size: 0.8rem; }
    li { margin-bottom: 0.2rem; }
    li:last-child { margin-bottom: 0; }

    .method {
      display: inline-block;
      padding: 0.1rem 0.4rem;
      border-radius: 0.25rem;
      font-size: 0.65rem;
      font-weight: 700;
      font-family: monospace;
    }

    .method-post { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .method-get { background: rgba(59, 130, 246, 0.2); color: var(--accent); }
    .method-put { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
    .method-delete { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .task-detail-toggle {
      width: 1.25rem;
      height: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .task-item.show-details .task-detail-toggle { transform: rotate(180deg); }

    .doc-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.2rem 0.4rem;
      border-radius: 0.25rem;
      transition: background 0.15s;
    }

    .doc-link:hover { background: var(--bg-hover); }
    .doc-link svg { width: 0.75rem; height: 0.75rem; }

    footer {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 640px) {
      .container { padding: 1rem; }
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
      .phase-header { flex-wrap: wrap; gap: 0.5rem; }
      .task-top { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M9 9h6M9 13h6M9 17h4"/>
          </svg>
          Admin Panel Task Tracker
        </h1>
        <p>53 tasks across 7 phases - click any task for full implementation details</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="exportData()">Export</button>
        <button class="btn btn-secondary" onclick="importData()">Import</button>
        <button class="btn btn-danger" onclick="resetAll()">Reset All</button>
      </div>
    </header>

    <div class="stats-bar" id="stats"></div>

    <div class="progress-section">
      <div class="progress-header">
        <h3>Overall Progress</h3>
        <span class="percent" id="overallPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <div class="filter-row">
      <div class="status-pills" id="statusPills">
        <button class="status-pill active" data-filter="all">All <span class="count" id="countAll">53</span></button>
        <button class="status-pill" data-filter="pending">Pending <span class="count" id="countPending">53</span></button>
        <button class="status-pill" data-filter="in-progress">In Progress <span class="count" id="countInProgress">0</span></button>
        <button class="status-pill" data-filter="completed">Completed <span class="count" id="countCompleted">0</span></button>
      </div>
      <input type="text" class="search-box" id="searchBox" placeholder="Search tasks...">
    </div>

    <div class="phases-grid" id="phasesGrid"></div>

    <footer>
      <p>Auto-saves locally &bull; <a href="https://github.com/Shivamingale3/practice-ecommerce-backend/tree/master/docs/admin-panel" target="_blank">View on GitHub</a></p>
    </footer>
  </div>

<script>
const STORAGE_KEY = 'admin_panel_tasks_v2';

const phasesData = [
{
  id: 0,
  name: 'Admin Authentication & Profile',
  doc: 'PHASE_0_Admin_Auth_Profile.md',
  tasks: [
    {
      id: '0.1',
      name: 'Admin Login (OTP Request)',
      method: 'POST',
      endpoint: '/api/admin/v1/auth/login',
      request: `{
  "email": "admin@example.com"
}`,
      response: `{
  "success": true,
  "data": {
    "message": "OTP sent to email",
    "expiresAt": "2026-05-01T10:05:00Z"
  }
}`,
      validation: [
        { field: 'email', type: 'String', required: true, rules: 'Valid email format' }
      ],
      dbActions: ['Insert: AdminOtp (email, otp, expiresAt)'],
      errors: [
        { code: 'NOT_FOUND', message: 'Admin not found', condition: 'Email not in admins table' },
        { code: 'BAD_REQUEST', message: 'OTP already sent', condition: 'Within 60s cooldown' }
      ],
      notes: 'Sends 6-digit OTP to admin email, valid 5 minutes'
    },
    {
      id: '0.2',
      name: 'Verify OTP',
      method: 'POST',
      endpoint: '/api/admin/v1/auth/verify-otp',
      request: `{
  "email": "admin@example.com",
  "otp": "123456"
}`,
      response: `{
  "success": true,
  "data": {
    "accessToken": "eyJ...",
    "refreshToken": "eyJ...",
    "expiresIn": 900,
    "admin": { "id": "...", "email": "...", "role": "ADMIN" }
  }
}`,
      validation: [
        { field: 'email', type: 'String', required: true, rules: 'Valid email' },
        { field: 'otp', type: 'String', required: true, rules: '6 digits' }
      ],
      dbActions: ['Select: AdminOtp WHERE email AND deleted=false', 'Delete: AdminOtp after use'],
      errors: [
        { code: 'BAD_REQUEST', message: 'Invalid OTP', condition: 'OTP mismatch or expired' },
        { code: 'NOT_FOUND', message: 'OTP expired', condition: 'OTP not found or already used' }
      ],
      notes: 'Existing in AdminAuthService. Returns JWT tokens on success.'
    },
    {
      id: '0.3',
      name: 'Resend OTP',
      method: 'POST',
      endpoint: '/api/admin/v1/auth/resend-otp',
      request: `{
  "email": "admin@example.com"
}`,
      response: `{
  "success": true,
  "data": {
    "message": "OTP resent",
    "expiresAt": "2026-05-01T10:05:00Z"
  }
}`,
      validation: [
        { field: 'email', type: 'String', required: true, rules: 'Valid email' }
      ],
      dbActions: ['Update: AdminOtp (delete old, insert new)'],
      errors: [
        { code: 'NOT_FOUND', message: 'Admin not found', condition: 'Email not in admins' }
      ],
      notes: 'Existing in AdminAuthService. 60s cooldown between requests.'
    },
    {
      id: '0.4',
      name: 'Refresh Token',
      method: 'POST',
      endpoint: '/api/admin/v1/auth/refresh',
      request: `{
  "refreshToken": "eyJ..."
}`,
      response: `{
  "success": true,
  "data": {
    "accessToken": "eyJ...",
    "expiresIn": 900
  }
}`,
      validation: [
        { field: 'refreshToken', type: 'String', required: true, rules: 'Valid JWT' }
      ],
      dbActions: ['Validate: RefreshToken in database'],
      errors: [
        { code: 'UNAUTHORIZED', message: 'Invalid refresh token', condition: 'Token expired or revoked' }
      ],
      notes: 'Only access token refreshed, not refresh token itself'
    },
    {
      id: '0.5',
      name: 'Get Admin Profile',
      method: 'GET',
      endpoint: '/api/admin/v1/profile',
      request: 'No body - JWT in Authorization header',
      response: `{
  "success": true,
  "data": {
    "id": "01ARZ...",
    "email": "admin@example.com",
    "name": "John Admin",
    "role": "ADMIN",
    "createdAt": "2026-01-15T10:00:00Z"
  }
}`,
      validation: [],
      dbActions: ['Select: Admin WHERE id = JWT.subject AND deleted=false'],
      errors: [],
      notes: 'Extracts admin ID from JWT token'
    },
    {
      id: '0.6',
      name: 'Update Admin Profile',
      method: 'PUT',
      endpoint: '/api/admin/v1/profile',
      request: `{
  "name": "John Smith",
  "currentPassword": "old123",
  "newPassword": "new456"
}`,
      response: `{
  "success": true,
  "message": "Profile updated",
  "data": {
    "id": "01ARZ...",
    "email": "admin@example.com",
    "name": "John Smith"
  }
}`,
      validation: [
        { field: 'name', type: 'String', required: false, rules: 'Max 100 chars' },
        { field: 'currentPassword', type: 'String', required: false, rules: 'Required if changing password' },
        { field: 'newPassword', type: 'String', required: false, rules: 'Min 8 chars if provided' }
      ],
      dbActions: ['Update: Admin (name, passwordHash)'],
      errors: [
        { code: 'BAD_REQUEST', message: 'Current password incorrect', condition: 'Password mismatch' },
        { code: 'BAD_REQUEST', message: 'New password too weak', condition: 'Validation failed' }
      ],
      notes: 'Password change requires current password verification'
    },
    {
      id: '0.7',
      name: 'Logout',
      method: 'POST',
      endpoint: '/api/admin/v1/auth/logout',
      request: `{ "refreshToken": "eyJ..." }`,
      response: `{
  "success": true,
  "message": "Logged out successfully"
}`,
      validation: [],
      dbActions: ['Delete: RefreshToken from database'],
      errors: [],
      notes: 'Invalidates refresh token server-side'
    }
  ]
},
{
  id: 1,
  name: 'Media Library',
  doc: 'PHASE_1_Media_Library.md',
  tasks: [
    {
      id: '1.1',
      name: 'Request Upload URL',
      method: 'POST',
      endpoint: '/api/admin/v1/media/upload-url',
      request: `{
  "filename": "hero-image.jpg",
  "mimeType": "image/jpeg",
  "fileSize": 2048000
}`,
      response: `{
  "success": true,
  "data": {
    "mediaId": "temp_01ARZ...",
    "uploadUrl": "https://minio.../media/... ?signature=...",
    "key": "media/2026/05/01/01ARZ/hero-image.jpg",
    "expiresAt": "2026-05-01T10:05:00Z",
    "method": "PUT"
  }
}`,
      validation: [
        { field: 'filename', type: 'String', required: true, rules: 'Max 255 chars, valid extension' },
        { field: 'mimeType', type: 'String', required: true, rules: 'Allowed: image/jpeg, png, webp, gif, video/mp4, webm, audio/mpeg, ogg, pdf' },
        { field: 'fileSize', type: 'Long', required: true, rules: 'Max 5MB (5242880 bytes)' }
      ],
      dbActions: ['None (temp record only)'],
      cacheActions: ['Set: pending_upload:{mediaId} TTL 5min'],
      errors: [
        { code: 'BAD_REQUEST', message: 'File size exceeds 5MB', condition: 'fileSize > 5242880' },
        { code: 'BAD_REQUEST', message: 'File type not allowed', condition: 'mimeType not in allowed list' }
      ],
      notes: 'Generate presigned PUT URL from ObjectStorageService. Client uploads directly to S3.'
    },
    {
      id: '1.2',
      name: 'Confirm Upload',
      method: 'POST',
      endpoint: '/api/admin/v1/media/confirm-upload',

let state = {
  tasks: {},
  expandedPhases: [0, 5],
  expandedTasks: {},
  filter: 'all',
  search: ''
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      state.tasks = parsed.tasks || {};
      state.expandedPhases = parsed.expandedPhases || [0, 5];
      state.expandedTasks = parsed.expandedTasks || {};
    }
  } catch (e) { console.warn('Load failed:', e); }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tasks: state.tasks,
      expandedPhases: state.expandedPhases,
      expandedTasks: state.expandedTasks
    }));
  } catch (e) { console.warn('Save failed:', e); }
}

function getTaskStatus(taskId) { return state.tasks[taskId] || 'pending'; }

function setTaskStatus(taskId, status) {
  state.tasks[taskId] = status;
  saveState();
  render();
}

function toggleTask(taskId) {
  const current = getTaskStatus(taskId);
  setTaskStatus(taskId, current === 'completed' ? 'pending' : 'completed');
}

function toggleInProgress(e) {
  e.stopPropagation();
  const taskId = e.target.dataset.id;
  const current = getTaskStatus(taskId);
  setTaskStatus(taskId, current === 'in-progress' ? 'pending' : 'in-progress');
}

function toggleTaskDetails(e) {
  e.stopPropagation();
  const taskId = e.target.closest('.task-item').dataset.id;
  state.expandedTasks[taskId] = !state.expandedTasks[taskId];
  saveState();
  render();
}

function togglePhase(phaseId) {
  const idx = state.expandedPhases.indexOf(phaseId);
  if (idx >= 0) state.expandedPhases.splice(idx, 1);
  else state.expandedPhases.push(phaseId);
  saveState();
  render();
}

function resetAll() {
  if (confirm('Reset all tasks to pending?')) {
    state.tasks = {};
    state.expandedTasks = {};
    saveState();
    render();
  }
}

function exportData() {
  const data = JSON.stringify({ tasks: state.tasks, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `admin-panel-tasks-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.tasks) { state.tasks = data.tasks; saveState(); render(); }
      } catch (err) { alert('Invalid file'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function filterTasks() {
  state.filter = document.querySelector('.status-pill.active')?.dataset.filter || 'all';
  state.search = document.getElementById('searchBox').value.toLowerCase();
  render();
}

function matchesFilter(task, phase) {
  if (state.filter !== 'all' && state.filter !== getTaskStatus(task.id)) return false;
  if (state.search) {
    const searchStr = `${task.name} ${task.endpoint} ${task.notes || ''} ${phase.name}`.toLowerCase();
    if (!searchStr.includes(state.search)) return false;
  }
  return true;
}

function getMethodClass(method) {
  const map = { POST: 'method-post', GET: 'method-get', PUT: 'method-put', DELETE: 'method-delete', SCHEDULED: 'method-put' };
  return map[method] || 'method-get';
}

function renderTaskDetails(task) {
  let html = `<div class="task-details">`;

  if (task.request && task.request !== 'No body - JWT in Authorization header' && task.request !== 'Path param: category ID' && task.request !== 'Path param: brand ID' && task.request !== 'Path param: tag ID' && task.request !== 'Path param: product ID' && task.request !== 'Query params: limit, offset, type, search' && task.request !== 'Query params: limit, offset, parentId, active, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, type' && task.request !== 'Query params: limit, offset, threshold' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, status, brandId, categoryId, minPrice, maxPrice' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'Query params: limit, offset, search' && task.request !== 'No request - automatic job' && task.request !== 'Query params: role (optional)') {
    html += `<div class="detail-section"><div class="detail-label">Request Body</div><pre><code>${task.request}</code></pre></div>`;
  } else if (task.request === 'No body - JWT in Authorization header') {
    html += `<div class="detail-section"><div class="detail-label">Request</div><div class="detail-value">No body - JWT in <code>Authorization: Bearer &lt;token&gt;</code> header</div></div>`;
  } else if (task.request === 'No request - automatic job') {
    html += `<div class="detail-section"><div class="detail-label">Request</div><div class="detail-value">No request - automatic scheduled job</div></div>`;
  } else if (task.request.startsWith('Path param:') || task.request.startsWith('Query params:')) {
    html += `<div class="detail-section"><div class="detail-label">Request</div><div class="detail-value">${task.request}</div></div>`;
  }

  if (task.response) {
    html += `<div class="detail-section"><div class="detail-label">Response (200)</div><pre><code>${task.response}</code></pre></div>`;
  }

  if (task.validation && task.validation.length > 0) {
    html += `<div class="detail-section"><div class="detail-label">Validation</div><table><thead><tr><th>Field</th><th>Type</th><th>Required</th><th>Rules</th></tr></thead><tbody>`;
    task.validation.forEach(v => {
      html += `<tr><td>${v.field}</td><td>${v.type}</td><td>${v.required ? 'Yes' : 'No'}</td><td>${v.rules}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  if (task.dbActions && task.dbActions.length > 0) {
    html += `<div class="detail-section"><div class="detail-label">DB Actions</div><ul>`;
    task.dbActions.forEach(a => html += `<li><code>${a}</code></li>`);
    html += `</ul></div>`;
  }

  if (task.cacheActions && task.cacheActions.length > 0) {
    html += `<div class="detail-section"><div class="detail-label">Cache Actions</div><ul>`;
    task.cacheActions.forEach(a => html += `<li><code>${a}</code></li>`);
    html += `</ul></div>`;
  }

  if (task.errors && task.errors.length > 0) {
    html += `<div class="detail-section"><div class="detail-label">Errors</div><table class="error-table"><thead><tr><th>Code</th><th>Message</th><th>Condition</th></tr></thead><tbody>`;
    task.errors.forEach(e => {
      html += `<tr><td>${e.code}</td><td>${e.message}</td><td>${e.condition}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

  if (task.notes) {
    html += `<div class="detail-section"><div class="detail-label">Notes</div><div class="detail-value" style="color: var(--warning)">${task.notes}</div></div>`;
  }

  html += `</div>`;
  return html;
}

function render() {
  const totalTasks = phasesData.reduce((sum, p) => sum + p.tasks.length, 0);
  const completedTasks = Object.values(state.tasks).filter(s => s === 'completed').length;
  const inProgressTasks = Object.values(state.tasks).filter(s => s === 'in-progress').length;
  const pendingTasks = totalTasks - completedTasks - inProgressTasks;

  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="label">Total</div><div class="value">${totalTasks}</div></div>
    <div class="stat-card"><div class="label">Completed</div><div class="value success">${completedTasks}</div></div>
    <div class="stat-card"><div class="label">In Progress</div><div class="value in-progress">${inProgressTasks}</div></div>
    <div class="stat-card"><div class="label">Pending</div><div class="value pending">${pendingTasks}</div></div>
  `;

  document.getElementById('countAll').textContent = totalTasks;
  document.getElementById('countPending').textContent = pendingTasks;
  document.getElementById('countInProgress').textContent = inProgressTasks;
  document.getElementById('countCompleted').textContent = completedTasks;

  const percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
  document.getElementById('overallPercent').textContent = `${percent}%`;
  document.getElementById('progressFill').style.width = `${percent}%`;

  const grid = document.getElementById('phasesGrid');
  let html = '';

  for (const phase of phasesData) {
    const phaseCompleted = phase.tasks.filter(t => getTaskStatus(t.id) === 'completed').length;
    const isExpanded = state.expandedPhases.includes(phase.id);
    const visibleTasks = phase.tasks.filter(t => matchesFilter(t, phase));

    if (visibleTasks.length === 0 && (state.filter !== 'all' || state.search)) continue;

    html += `
      <div class="phase-card ${isExpanded ? 'expanded' : ''}" data-phase="${phase.id}">
        <div class="phase-header" onclick="togglePhase(${phase.id})">
          <div class="phase-title">
            <div class="phase-badge">P${phase.id}</div>
            <div class="phase-info">
              <h3>${phase.name}</h3>
              <div class="meta">${phase.tasks.length} tasks</div>
            </div>
          </div>
          <div class="phase-actions">
            <span class="phase-progress"><span class="done">${phaseCompleted}</span>/${phase.tasks.length}</span>
            <a href="${phase.doc}" class="doc-link" onclick="event.stopPropagation()" target="_blank">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
              Doc
            </a>
            <div class="phase-toggle">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>
        <div class="phase-content">
          <div class="task-list">
            ${visibleTasks.map(task => `
              <div class="task-item ${getTaskStatus(task.id)} ${state.expandedTasks[task.id] ? 'show-details' : ''}" data-id="${task.id}">
                <div class="task-header">
                  <div class="task-checkbox ${getTaskStatus(task.id) === 'completed' ? 'checked' : ''}" onclick="toggleTask('${task.id}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
                  </div>
                  <div class="task-main">
                    <div class="task-top">
                      <span class="task-name">${task.name}</span>
                      <span class="task-endpoint"><span class="method ${getMethodClass(task.method)}">${task.method}</span> ${task.endpoint}</span>
                      ${getTaskStatus(task.id) !== 'pending' ? `<span class="badge badge-${getTaskStatus(task.id).replace('-', '')}">${getTaskStatus(task.id)}</span>` : ''}
                    </div>
                  </div>
                  <div class="task-actions">
                    <button class="btn-sm btn-sm-inprogress ${getTaskStatus(task.id) === 'in-progress' ? 'active' : ''}" data-id="${task.id}" onclick="toggleInProgress(event)">
                      ${getTaskStatus(task.id) === 'in-progress' ? 'Stop' : 'In Progress'}
                    </button>
                    <button class="btn-sm" onclick="toggleTaskDetails(event)" style="background: var(--bg); color: var(--text-muted);">
                      ${state.expandedTasks[task.id] ? 'Less' : 'Details'}
                    </button>
                  </div>
                </div>
                ${renderTaskDetails(task)}
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  }

  grid.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
  loadState();
  render();

  document.getElementById('searchBox').addEventListener('input', filterTasks);

  document.querySelectorAll('.status-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('.status-pill').forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      filterTasks();
    });
  });
});
</script>
</body>
</html>
